# Note+ on the host's nginx: note.noryx.fr -> the Note+ server on port 8787.
# Installed by deploy/setup-server.sh; certbot then adds the https block.
server {
    server_name note.noryx.fr;
    listen 80;
    listen [::]:80;

    # the api's requests are small; notes travel over the websocket
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # the sync's websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_note;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a note can stay open for hours
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade_note {
    default upgrade;
    '' close;
}
